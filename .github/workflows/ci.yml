name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_STAGING_INTEGRATION: ${{ secrets.INDEXING_CO_STAGING_API_KEY != '' }}
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run quality:baseline
      - run: npm run quality:security
      - name: Staging integration capability
        if: ${{ env.HAS_STAGING_INTEGRATION == 'true' }}
        env:
          INDEXING_CO_STAGING_API_KEY: ${{ secrets.INDEXING_CO_STAGING_API_KEY }}
        run: npm run quality:integration
      - name: Record unavailable staging capability
        if: ${{ env.HAS_STAGING_INTEGRATION != 'true' }}
        run: echo "::warning::quality:integration unavailable; INDEXING_CO_STAGING_API_KEY is not configured"
